name: Deployment

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: none
      artifact-metadata: none
      attestations:: none
      checks: none
      code-quality: none
      contents: read
      deployments: write
      discussions: none
      id_token: none
      issues: none
      models: none
      packages: none
      pages: none
      pull-requests: none
      security-events: none
      statuses: none
      vulnerability-alerts: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: SSH Deployment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 #v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm ~/.pm2/logs/zbot-error.log
            rm ~/.pm2/logs/zbot-out.log
            cd ~/BOT/Z-BOT
            git pull origin main
            npm install
            pm2 restart zbot
